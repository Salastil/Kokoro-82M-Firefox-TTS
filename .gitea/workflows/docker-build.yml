# Builds and pushes the companion server image (server/, CPU only) to
# this Gitea instance's container registry whenever server/ changes on
# main, or on demand via the "Run workflow" button.
#
# Prerequisites (see server/README section "Docker" / repo README for
# manual build/push instructions if you want to do this by hand instead):
#   1. An act_runner registered with this Gitea instance that has
#      Docker access (Docker-in-Docker or a mounted docker socket --
#      a property of how the runner itself is deployed, not this file).
#   2. Settings > Actions > Secrets: CI_TOKEN (a Gitea Personal Access
#      Token, Settings > Applications > Generate New Token, used for
#      checkout) and DOCKER (a Personal Access Token with the
#      "write:package" scope, used to log in to the container
#      registry). Gitea's automatic per-run token isn't reliable for
#      container registry auth as of writing, so DOCKER has to be a
#      real PAT, not left unset.
#
# Edit REGISTRY_OWNER below to your Gitea username/org.
name: Build and push companion server image

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".gitea/workflows/docker-build.yml"
  workflow_dispatch: {}

env:
  REGISTRY: git.salastil.com
  REGISTRY_OWNER: CHANGEME # <-- your Gitea username or org
  IMAGE_NAME: kokoro-reader-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_OWNER }}
          password: ${{ secrets.DOCKER }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:${{ gitea.sha }}
