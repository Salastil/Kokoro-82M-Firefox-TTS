# Builds the extension, bumps its version, self-signs it with Mozilla
# (AMO) for self-distribution, and publishes the resulting .xpi as the
# workflow's build artifact -- on every push to main that touches the
# extension, or on demand via "Run workflow".
#
# AMO refuses to re-sign a version it's already seen for this add-on
# ID, so every run needs a version nobody has signed before -- hence
# the auto patch-bump (extension/manifest.json is the source of truth;
# package.json/package-lock.json are kept in sync via `npm run
# version:bump`, see scripts/bump-version.mjs). The bump is committed
# and pushed straight back to main with "[skip ci]" in the message,
# which this workflow's `if:` below uses to avoid triggering itself in
# a loop.
#
# Secrets needed (Settings > Actions > Secrets on the repo):
#   CI_TOKEN          A Gitea Personal Access Token (Settings >
#                      Applications > Generate New Token) with repo
#                      read/write, used for checkout and to push the
#                      version-bump commit back to main.
#   WEB_EXT_API_KEY    AMO API credentials -- generate at
#   WEB_EXT_API_SECRET https://addons.mozilla.org/developers/addon/api/key/.
#                      web-ext picks both up automatically from the
#                      environment (no manifest/CLI changes needed).
name: Build, version-bump, and sign extension

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "extension/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/bump-version.mjs"
      - ".gitea/workflows/build-extension.yml"
  workflow_dispatch: {}

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    if: "!contains(gitea.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(npm run version:bump --silent)
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITEA_OUTPUT"

      - name: Commit and push version bump
        run: |
          git config user.name "gitea-actions"
          git config user.email "actions@git.salastil.com"
          git add extension/manifest.json package.json package-lock.json
          git commit -m "ci: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Build extension
        run: npm run build

      - name: Lint extension
        run: npm run lint:ext

      - name: Sign extension with Mozilla (AMO)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: npm run sign:ext

      - name: Upload signed .xpi
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-reader-${{ steps.bump.outputs.version }}
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error
