# Bumps the extension's version, builds it, and publishes the
# (unsigned) build as the workflow's artifact -- on every push to main
# that touches the extension, or on demand via "Run workflow". This is
# a cheap per-commit sanity check (does it still build and pass
# web-ext lint), not a distributable release -- AMO signing only
# happens for tagged releases (see release.yml) since AMO refuses to
# re-sign a version it's already seen, and signing every single commit
# would burn through versions for no reason.
#
# extension/manifest.json is the version source of truth;
# package.json/package-lock.json are kept in sync via `npm run
# version:bump` (see scripts/bump-version.mjs). The bump is committed
# and pushed straight back to main with "[skip ci]" in the message,
# which this workflow's `if:` below uses to avoid triggering itself in
# a loop. When you want an actual signed release, tag the resulting
# commit (`git tag vX.Y.Z && git push gitea vX.Y.Z`) -- see release.yml.
#
# Secrets needed (Settings > Actions > Secrets on the repo):
#   CI_TOKEN   A Gitea Personal Access Token (Settings > Applications >
#              Generate New Token) with repo read/write, used for
#              checkout and to push the version-bump commit back to main.
name: Build and version-bump extension

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "extension/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/bump-version.mjs"
      - ".gitea/workflows/build-extension.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(gitea.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(npm run version:bump --silent)
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITEA_OUTPUT"

      - name: Commit and push version bump
        run: |
          git config user.name "gitea-actions"
          git config user.email "actions@git.salastil.com"
          git add extension/manifest.json package.json package-lock.json
          git commit -m "ci: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Build extension
        run: npm run build

      - name: Lint extension
        run: npm run lint:ext

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-reader-unsigned-${{ steps.bump.outputs.version }}
          path: extension/
          if-no-files-found: error
