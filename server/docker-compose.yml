# `docker compose up -d --build`. CPU only.
#
# `image:` is what makes `docker compose push` push somewhere real
# instead of "Skipped" (without it, compose just tags the build
# locally and has nowhere to push it to). Change the owner/tag below
# to match your registry; `docker login git.salastil.com` first (as
# the same user -- root's `sudo docker login` if you run compose with
# sudo, since credentials are stored per-user).
services:
  kokoro-reader-server:
    image: git.salastil.com/salastil/kokoro-reader-server:cpu
    build:
      context: .
    restart: unless-stopped
    # environment:
    #   # Only needed if you switch the volumes below to host bind
    #   # mounts (e.g. "./config:/home/kokoro/.config") instead of the
    #   # named volumes here -- matches whatever user/group should own
    #   # those host paths. Named volumes don't need this. See README's
    #   # "Bind-mounting a host directory" section.
    #   PUID: "1000"
    #   PGID: "1000"
    ports:
      # Loopback-only on the host side by default -- change to
      # "8787:8787" only if you deliberately want this reachable from
      # other machines on your network (the bearer token still gates
      # access either way, this is defense in depth). See README's
      # "Remote access (listening mode)" section for that setup.
      - "127.0.0.1:8787:8787"
    volumes:
      # Config (incl. the generated auth token) and the downloaded
      # model weights persist across container recreation.
      - kokoro-config:/home/kokoro/.config
      - kokoro-hf-cache:/home/kokoro/.cache/huggingface

volumes:
  kokoro-config:
  kokoro-hf-cache:
